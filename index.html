
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <h1>ANIMATION</h1>
    </nav>

    <main class="container">

        <!-- Animation via Hover -->
        <section>
            <h2>Animation via Hover</h2>

            <div class="card-container">
                <div class="card hover-left">
                    <span>Left</span>
                </div>

                <div class="card hover-center">
                    <span>Center</span>
                </div>

                <div class="card hover-right">
                    <span>Right</span>
                </div>
            </div>
        </section>

        <!-- Animation Autoplay -->
        <section>
            <h2>Animation Autoplay</h2>

            <div class="card-container">
                <div class="card auto-left">
                    <span>Left</span>
                </div>

                <div class="card auto-center">
                    <span>Center</span>
                </div>

                <div class="card auto-right">
                    <span>Right</span>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
